<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מבוך 2D - פאזלים סודיים</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #00ff00;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            background: radial-gradient(circle at 50% 50%, #0a0a0a, #000);
            border: 3px solid #00ff00;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.4), inset 0 0 40px rgba(0, 255, 0, 0.1);
            max-width: 90vw;
            max-height: 90vh;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        .hud {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid #00ff00;
            padding: 20px;
            border-radius: 8px;
            font-size: 0.9em;
            max-width: 280px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            z-index: 10;
        }

        .hud-title {
            color: #00ff00;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #00ff00;
            font-size: 1.2em;
        }

        .hud-item {
            margin: 10px 0;
            padding: 8px;
            border-left: 3px solid #00ff00;
            padding-left: 12px;
            color: #00aa00;
            transition: all 0.3s ease;
        }

        .hud-item.collected {
            color: #00ff00;
            border-left-color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }

        .puzzle-status {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #00ff00;
            color: #00ff00;
            font-weight: bold;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid #00ff00;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.85em;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            color: #00aa00;
        }

        .controls > div {
            margin: 5px 0;
        }

        .exit-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #00ff00, #00aa00);
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .exit-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
        }

        .exit-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(10, 10, 10, 0.98);
            border: 3px solid #00ff00;
            border-radius: 10px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.4);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 2em;
            font-weight: bold;
            color: #00ff00;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
        }

        .modal-text {
            color: #00aa00;
            margin-bottom: 20px;
            font-size: 0.95em;
        }

        .password-input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ff00;
            border-radius: 5px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .password-input:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .modal-button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #00ff00, #00aa00);
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
        }

        .modal-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }

        .error-message {
            color: #ff0000;
            margin-top: 10px;
            display: none;
            animation: shake 0.3s ease;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Success Modal */
        .success-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 101;
            justify-content: center;
            align-items: center;
        }

        .success-modal.active {
            display: flex;
        }

        .success-content {
            background: rgba(10, 20, 10, 0.98);
            border: 3px solid #00ff00;
            border-radius: 10px;
            padding: 50px 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 60px rgba(0, 255, 0, 0.5);
            animation: popUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popUp {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-title {
            font-size: 2.5em;
            font-weight: bold;
            color: #00ff00;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00ff00;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .success-message {
            color: #00aa00;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .link-display {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff00;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .copy-button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #00ff00, #00aa00);
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }

        .copy-msg {
            color: #00ff00;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .copy-msg.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="mazeCanvas"></canvas>
    </div>

    <!-- HUD -->
    <div class="hud">
        <div class="hud-title">📍 מצב המשחק</div>
        <div class="hud-item" id="puzzle-1">○ 76 #1</div>
        <div class="hud-item" id="puzzle-2">○ 81 #2</div>
        <div class="hud-item" id="puzzle-3">○ 99 #3</div>
        <div class="puzzle-status">
            אספת: <span id="puzzle-count">0</span>/3
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div>⬆️ W - כיוון מסתכל</div>
        <div>⬅️ A - שמאל</div>
        <div>⬇️ S - אחורה</div>
        <div>➡️ D - ימין</div>
        <div style="margin-top: 10px; color: #00ff00;">
            🔍 חפש פתקים!
        </div>
    </div>

    <!-- Exit Button -->
    <button class="exit-btn" id="exit-btn" disabled>צא מהמבוך</button>

    <!-- Password Modal -->
    <div class="modal" id="password-modal">
        <div class="modal-content">
            <div class="modal-title">🔐 סיסמה</div>
            <div class="modal-text">הכנס את המספרים מהפתקים בסדר הנכון</div>
            <input type="password" class="password-input" id="password-input" placeholder="הכנס סיסמה" onkeypress="if(event.key==='Enter') checkPassword()">
            <div>
                <button class="modal-button" onclick="checkPassword()">אימות</button>
                <button class="modal-button" onclick="closePassword()" style="background: #333;">ביטול</button>
            </div>
            <div class="error-message" id="error-msg">❌ סיסמה שגויה!</div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="success-modal" id="success-modal">
        <div class="success-content">
            <div class="success-title">✨ הצלחה! ✨</div>
            <div class="success-message">פתחת את דלת המבוך!<br>הנה הקישור למשהו מיוחד...</div>
            <div class="link-display">https://imgur.com/a/R4JvHpZ</div>
            <button class="copy-button" onclick="copyLink()">📋 העתק קישור</button>
            <div class="copy-msg" id="copy-msg">✓ הקישור הועתק!</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');

        // Canvas size - larger maze
        canvas.width = 1200;
        canvas.height = 1000;

        // Game variables
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 8,
            angle: 0,
            speed: 3
        };

        const maze = {
            walls: [],
            puzzles: [
                { x: 200, y: 200, text: '76 #1', id: 1, collected: false },
                { x: 1000, y: 200, text: '81 #2', id: 2, collected: false },
                { x: 600, y: 850, text: '99 #3', id: 3, collected: false }
            ]
        };

        // Create maze walls - larger and more complex
        function createMaze() {
            const walls = [];
            
            // Border walls
            walls.push({ x: 0, y: 0, w: canvas.width, h: 25 }); // top
            walls.push({ x: 0, y: canvas.height - 25, w: canvas.width, h: 25 }); // bottom
            walls.push({ x: 0, y: 0, w: 25, h: canvas.height }); // left
            walls.push({ x: canvas.width - 25, y: 0, w: 25, h: canvas.height }); // right

            // Complex internal maze
            walls.push({ x: 100, y: 100, w: 400, h: 25 });
            walls.push({ x: 100, y: 100, w: 25, h: 350 });
            walls.push({ x: 475, y: 200, w: 25, h: 250 });
            walls.push({ x: 150, y: 450, w: 350, h: 25 });
            walls.push({ x: 550, y: 100, w: 25, h: 400 });
            walls.push({ x: 550, y: 475, w: 200, h: 25 });
            walls.push({ x: 800, y: 150, w: 25, h: 350 });
            walls.push({ x: 650, y: 500, w: 200, h: 25 });
            walls.push({ x: 200, y: 600, w: 25, h: 250 });
            walls.push({ x: 225, y: 750, w: 250, h: 25 });
            walls.push({ x: 750, y: 600, w: 25, h: 200 });
            walls.push({ x: 850, y: 800, w: 25, h: 100 });
            walls.push({ x: 300, y: 300, w: 150, h: 25 });
            walls.push({ x: 600, y: 350, w: 150, h: 25 });
            walls.push({ x: 900, y: 250, w: 25, h: 350 });
            walls.push({ x: 50, y: 800, w: 200, h: 25 });
            walls.push({ x: 400, y: 850, w: 25, h: 125 });

            maze.walls = walls;
        }

        // Draw functions
        function drawWalls() {
            ctx.fillStyle = '#00ff00';
            ctx.shadowColor = 'rgba(0, 255, 0, 0.5)';
            ctx.shadowBlur = 10;
            
            maze.walls.forEach(wall => {
                ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
            });
            
            ctx.shadowBlur = 0;
        }

        function drawPuzzles() {
            maze.puzzles.forEach(puzzle => {
                if (!puzzle.collected) {
                    // Draw paper background
                    ctx.fillStyle = '#ffffdd';
                    ctx.shadowColor = 'rgba(255, 255, 150, 0.6)';
                    ctx.shadowBlur = 15;
                    ctx.fillRect(puzzle.x - 25, puzzle.y - 25, 50, 50);
                    
                    // Draw border
                    ctx.strokeStyle = '#333333';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(puzzle.x - 25, puzzle.y - 25, 50, 50);
                    
                    // Draw text
                    ctx.fillStyle = '#333333';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(puzzle.text, puzzle.x, puzzle.y);
                    
                    ctx.shadowBlur = 0;
                }
            });
        }

        function drawPlayer() {
            ctx.fillStyle = '#00ff00';
            ctx.shadowColor = 'rgba(0, 255, 0, 0.8)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw direction
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(
                player.x + Math.cos(player.angle) * 15,
                player.y + Math.sin(player.angle) * 15
            );
            ctx.stroke();
            
            ctx.shadowBlur = 0;
        }

        // Better collision detection - push player out of walls
        function checkWallCollision(x, y, radius) {
            const padding = radius + 3;
            
            for (let wall of maze.walls) {
                // Find the closest point on the rectangle to the circle
                const closestX = Math.max(wall.x, Math.min(x, wall.x + wall.w));
                const closestY = Math.max(wall.y, Math.min(y, wall.y + wall.h));
                
                // Distance between circle center and closest point
                const dx = x - closestX;
                const dy = y - closestY;
                const distSq = dx * dx + dy * dy;
                
                if (distSq < padding * padding) {
                    return { collision: true, closestX, closestY, dx, dy, distSq };
                }
            }
            return { collision: false };
        }

        // Move with collision - push out of walls if stuck
        function moveWithCollision(x, y) {
            const radius = player.radius;
            const collision = checkWallCollision(x, y, radius);
            
            if (!collision.collision) {
                // No collision, move freely
                player.x = x;
                player.y = y;
                return;
            }
            
            // If colliding, try to move out
            const dist = Math.sqrt(collision.distSq);
            if (dist === 0) {
                // Dead center of wall, push in direction of movement
                if (x !== player.x || y !== player.y) {
                    const moveAngle = Math.atan2(y - player.y, x - player.x);
                    player.x = collision.closestX + Math.cos(moveAngle) * (radius + 5);
                    player.y = collision.closestY + Math.sin(moveAngle) * (radius + 5);
                }
                return;
            }
            
            // Push out of wall in the direction away from it
            const padding = radius + 3;
            const angle = Math.atan2(collision.dy, collision.dx);
            const pushDistance = (padding - dist) + 2;
            
            player.x = x + Math.cos(angle) * pushDistance;
            player.y = y + Math.sin(angle) * pushDistance;
            
            // Verify new position is safe
            const newCollision = checkWallCollision(player.x, player.y, radius);
            if (newCollision.collision) {
                // If still colliding, push more aggressively
                player.x = player.x + Math.cos(angle) * 5;
                player.y = player.y + Math.sin(angle) * 5;
            }
        }

        function checkPuzzleCollision(x, y) {
            for (let puzzle of maze.puzzles) {
                if (!puzzle.collected) {
                    const dist = Math.hypot(x - puzzle.x, y - puzzle.y);
                    if (dist < 40) {
                        puzzle.collected = true;
                        updateHUD();
                        return;
                    }
                }
            }
        }

        // Update HUD
        function updateHUD() {
            let count = 0;
            maze.puzzles.forEach((p, idx) => {
                const element = document.getElementById(`puzzle-${idx + 1}`);
                if (p.collected) {
                    element.classList.add('collected');
                    element.textContent = '✓ ' + p.text;
                    count++;
                } else {
                    element.classList.remove('collected');
                    element.textContent = '○ ' + p.text;
                }
            });
            
            document.getElementById('puzzle-count').textContent = count;
            
            const exitBtn = document.getElementById('exit-btn');
            if (count === 3) {
                exitBtn.disabled = false;
                exitBtn.style.opacity = '1';
            } else {
                exitBtn.disabled = true;
                exitBtn.style.opacity = '0.3';
            }
        }

        // Controls
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Mouse controls
        document.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);
        });

        // Exit button
        document.getElementById('exit-btn').addEventListener('click', () => {
            const collected = maze.puzzles.filter(p => p.collected).length;
            if (collected === 3) {
                document.getElementById('password-modal').classList.add('active');
                document.getElementById('password-input').focus();
            }
        });

        function closePassword() {
            document.getElementById('password-modal').classList.remove('active');
        }

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            if (input === '768199') {
                closePassword();
                document.getElementById('success-modal').classList.add('active');
            } else {
                document.getElementById('error-msg').classList.add('show');
                document.getElementById('password-input').value = '';
                setTimeout(() => {
                    document.getElementById('error-msg').classList.remove('show');
                }, 2000);
            }
        }

        function copyLink() {
            navigator.clipboard.writeText('https://imgur.com/a/R4JvHpZ').then(() => {
                const msg = document.getElementById('copy-msg');
                msg.classList.add('show');
                setTimeout(() => msg.classList.remove('show'), 2000);
            });
        }

        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.fillStyle = 'rgba(10, 10, 10, 0.95)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid background
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Handle movement
            let newX = player.x;
            let newY = player.y;

            const moveDistance = player.speed;
            const dx = Math.cos(player.angle);
            const dy = Math.sin(player.angle);

            if (keys['w'] || keys['arrowup']) {
                newX += dx * moveDistance;
                newY += dy * moveDistance;
            }
            if (keys['s'] || keys['arrowdown']) {
                newX -= dx * moveDistance;
                newY -= dy * moveDistance;
            }
            if (keys['a'] || keys['arrowleft']) {
                newX -= dy * moveDistance;
                newY += dx * moveDistance;
            }
            if (keys['d'] || keys['arrowright']) {
                newX += dy * moveDistance;
                newY -= dx * moveDistance;
            }

            // Always use collision-aware movement
            moveWithCollision(newX, newY);

            // Check puzzle collision
            checkPuzzleCollision(player.x, player.y);

            // Draw everything
            drawWalls();
            drawPuzzles();
            drawPlayer();

            requestAnimationFrame(gameLoop);
        }

        // Initialize
        createMaze();
        
        // Ensure player starts in safe position
        while (checkWallCollision(player.x, player.y, player.radius).collision) {
            player.x += 10;
            player.y += 10;
        }
        
        updateHUD();
        gameLoop();
    </script>
</body>
</html>
